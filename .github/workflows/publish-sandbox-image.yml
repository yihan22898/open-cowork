name: Publish Sandbox Image

# Builds and pushes the Open Cowork sandbox image to Docker Hub on every push
# to `main` (tags: latest + <sha>) and on every tag starting with `v`
# (additional tag: <version>).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: opencowork/sandbox

jobs:
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Build the JSON-RPC agent
        run: npm run build:docker-agent

      - name: Copy agent bundle into Docker build context
        run: |
          mkdir -p docker/sandbox/agent
          cp dist-docker-agent/index.js docker/sandbox/agent/index.js
          ls -l docker/sandbox/agent/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${SHORT_SHA}"
          else
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "::group::Computed tags"
          echo "$TAGS"
          echo "::endgroup::"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/sandbox
          file: docker/sandbox/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test the published image
        run: |
          set -euo pipefail
          # Pull and run a quick validation against the freshly published image.
          docker pull "${{ steps.tags.outputs.tags }}" || true
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            "${{ steps.tags.outputs.tags }}" \
            sh -c 'node -e "console.log(\"sandbox-image-ok\")" && python3 --version && node --version'
